name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest tests/ --ignore=tests/live

  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Build package
        run: uv build

      # --- Install-from-wheel smoke (POSIX) ---
      - name: Install wheel (POSIX)
        if: runner.os != 'Windows'
        run: |
          uv venv .venv-smoke
          .venv-smoke/bin/pip install dist/*.whl

      - name: Wheel smoke test (POSIX)
        if: runner.os != 'Windows'
        run: .venv-smoke/bin/suitewright --version

      # --- Install-from-wheel smoke (Windows) ---
      - name: Install wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          uv venv .venv-smoke
          .venv-smoke\Scripts\pip install (Get-ChildItem dist\*.whl).FullName
        shell: pwsh

      - name: Wheel smoke test (Windows)
        if: runner.os == 'Windows'
        run: .venv-smoke\Scripts\suitewright --version
        shell: pwsh

      # --- --no-deps import smoke (Linux only) ---
      - name: No-deps import smoke
        if: runner.os == 'Linux'
        run: |
          uv venv .venv-nodeps
          .venv-nodeps/bin/pip install --no-deps dist/*.whl
          .venv-nodeps/bin/python -c "import suitewright; print(suitewright.__version__)"

      # --- sdist install smoke (Linux only) ---
      - name: Install from sdist (Linux only)
        if: runner.os == 'Linux'
        run: |
          uv venv .venv-sdist
          .venv-sdist/bin/pip install dist/*.tar.gz
          .venv-sdist/bin/suitewright --version

      # --- CLI accessibility assertion (POSIX) ---
      - name: CLI no-ANSI assertion (POSIX)
        if: runner.os != 'Windows'
        env:
          NO_COLOR: "1"
        run: |
          output=$(.venv-smoke/bin/suitewright --help)
          if printf '%s' "$output" | grep -P '\x1b\[' > /dev/null 2>&1; then
            echo "FAIL: ANSI escape sequences detected under NO_COLOR=1"
            exit 1
          fi
          echo "PASS: No ANSI escape sequences in --help output"

      # --- CLI accessibility assertion (Windows) ---
      - name: CLI no-ANSI assertion (Windows)
        if: runner.os == 'Windows'
        env:
          NO_COLOR: "1"
        run: |
          $output = & .venv-smoke\Scripts\suitewright --help
          $joined = $output -join "`n"
          if ($joined -match '\x1b\[') {
            Write-Error "FAIL: ANSI escape sequences detected under NO_COLOR=1"
            exit 1
          }
          Write-Output "PASS: No ANSI escape sequences in --help output"
        shell: pwsh
