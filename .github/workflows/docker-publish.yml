# ─────────────────────────────────────────────────────────────────────────────
# Docker Publish - Build, scan, then push to GHCR with provenance and attestation
# Triggers: release published, manual dispatch
# Flow: preflight -> build (local) -> scan -> push (requires approval) -> attest
# ─────────────────────────────────────────────────────────────────────────────
name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Pre-flight: reject unresolved digest placeholders
  # ───────────────────────────────────────────────────────────────────────────
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject RESOLVE placeholders in Dockerfiles
        run: |
          set -euo pipefail
          if grep -rn '<RESOLVE>' Dockerfile Dockerfile.test 2>/dev/null; then
            echo "::error::Found <RESOLVE> placeholder(s) in Dockerfiles. Resolve digests before publishing."
            exit 1
          fi
          echo "No <RESOLVE> placeholders found - OK"

  # ───────────────────────────────────────────────────────────────────────────
  # Build image locally (no push) and export as tarball for scanning
  # ───────────────────────────────────────────────────────────────────────────
  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build image (local only, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as tarball
        run: |
          PRIMARY_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker save "$PRIMARY_TAG" -o /tmp/image.tar

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Trivy vulnerability scan on the built image (before push)
  # ───────────────────────────────────────────────────────────────────────────
  scan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/image.tar
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  # ───────────────────────────────────────────────────────────────────────────
  # Push to GHCR (requires environment approval from repo owner)
  # ───────────────────────────────────────────────────────────────────────────
  push:
    needs: [build, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: docker-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push-image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push
        id: push-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha

  # ───────────────────────────────────────────────────────────────────────────
  # Attest build provenance for the pushed image digest
  # ───────────────────────────────────────────────────────────────────────────
  attest:
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          subject-digest: ${{ needs.push.outputs.digest }}
          push-to-registry: true
