name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Hard-fail on unresolved digest placeholders
        run: |
          if grep -RIn '<RESOLVE>' Dockerfile Dockerfile.test; then
            echo "::error::Found <RESOLVE> placeholders in Dockerfiles"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        run: docker build -t suitewright:ci .

      - name: Build test image
        run: docker build -f Dockerfile.test -t suitewright-test:ci .

      - name: Run pytest in test container
        run: docker run --rm suitewright-test:ci pytest tests/ --ignore=tests/live --ignore=tests/scripts

      - name: Hardened runtime smoke (tmpfs uid/gid/mode)
        run: |
          docker run --rm \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777 \
            --tmpfs /home/suitewright/.cache/suitewright:rw,nosuid,nodev,uid=1000,gid=1000,mode=700 \
            --tmpfs /home/suitewright/runtime:rw,nosuid,nodev,uid=1000,gid=1000,mode=700 \
            suitewright:ci --help

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: suitewright:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
