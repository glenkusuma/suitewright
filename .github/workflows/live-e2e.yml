name: Live e2e

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run live end-to-end tests against the shared Google test account"
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: suitewright-live-e2e-shared-account
  cancel-in-progress: false

jobs:
  live-e2e:
    if: ${{ inputs.run_live }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: live-e2e
    permissions:
      contents: read

    env:
      SUITEWRIGHT_RUN_LIVE: "1"
      NO_COLOR: "1"
      PYTHONHASHSEED: "0"
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Materialize auth from secrets
        env:
          LIVE_CLIENT_SECRET_JSON: ${{ secrets.LIVE_CLIENT_SECRET_JSON }}
          LIVE_TOKEN_JSON: ${{ secrets.LIVE_TOKEN_JSON }}
        run: |
          mkdir -p "$RUNNER_TEMP/suitewright-auth"
          echo "$LIVE_CLIENT_SECRET_JSON" > "$RUNNER_TEMP/suitewright-auth/client_secret.json"
          echo "$LIVE_TOKEN_JSON" > "$RUNNER_TEMP/suitewright-auth/token.json"
          echo "SUITEWRIGHT_AUTH_DIR=$RUNNER_TEMP/suitewright-auth" >> "$GITHUB_ENV"

      - name: "Stage 1: smoke"
        run: uv run pytest tests/live/smoke/ --run-live -v

      - name: "Stage 2: mutate"
        run: uv run pytest tests/live/mutate/ --run-live -v

      - name: "Stage 3: destructive"
        run: uv run pytest tests/live/destructive/ --run-live -v

      - name: "Stage 4: e2e"
        run: uv run pytest tests/live/e2e/ --run-live -v

      - name: "Stage 5: check_leaks"
        run: uv run python tests/live/scripts/check_leaks.py
