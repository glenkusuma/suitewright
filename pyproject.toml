[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suitewright"
version = "0.0.1rc1"
description = "Portable Google Workspace CLI for humans and agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Glen Kusuma" }]
dependencies = [
  "google-api-python-client>=2.194.0",
  "google-auth-oauthlib>=1.3.1",
  "google-auth-httplib2>=0.3.1",
]
keywords = ["google-workspace", "cli", "gmail", "drive", "docs", "forms", "calendar"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Office/Business",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "twine>=5.1",
  "filelock>=3.15",
]

[project.scripts]
suitewright = "suitewright.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --ignore=tests/live"
markers = [
  "live: requires a real Google account; opt-in via --run-live",
  "smoke: read-only sanity checks against live APIs",
  "mutate: creates or modifies real resources (sandboxed)",
  "destructive: sends, deletes, or otherwise acts irreversibly (sandboxed)",
  "serial: tests that must run sequentially (no parallel execution)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/suitewright"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/suitewright",
  "README.md",
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S108"]
"src/suitewright/paths.py" = ["S105"]
"src/suitewright/auth.py" = ["S110", "S603"]
"tests/live/conftest.py" = ["S110"]
"tests/live/scripts/preflight.py" = ["S603", "S607"]
"tests/live/scripts/preflight-live.py" = ["S603", "S607"]
"tests/live/scripts/verify_install.py" = ["S603", "S607"]
"tests/live/scripts/bootstrap.py" = ["S603", "S607"]
"tests/live/scripts/check_leaks.py" = ["S603", "S607"]
"tests/live/helpers.py" = ["S603"]
"scripts/resolve-action-shas.py" = ["S603", "S607"]
"scripts/docker.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
files = ["src/suitewright/paths.py", "src/suitewright/cli.py"]

[tool.bandit]
exclude_dirs = ["tests", "_local"]
